# 기본 프로파일: DB를 쓰지 않는다. (목 웹 테스트는 테스트 런타임 h2로 컨텍스트만 띄움)
spring:
  application:
    name: backend
  servlet:
    multipart:
      max-file-size: 10MB      # 리뷰 사진 업로드(POST /reviews/photos). 기본 1MB는 사진에 부족.
      max-request-size: 10MB
  flyway:
    enabled: false      # 마이그레이션은 db 프로파일에서만 실행
  jpa:
    hibernate:
      ddl-auto: none    # 스키마를 건드리지 않음
    open-in-view: false
  ai:
    model:
      # none = ChatModel/ChatClient 빈 자체를 만들지 않는다. 이 값을 비워두면 Spring AI 자동설정이
      # 기본으로 켜지고(matchIfMissing=true), 키가 없으면 기동에서
      # "Incomplete Google GenAI configuration" 으로 죽는다. 테스트/무프로파일은 키가 없으므로 none 이 기본.
      # 켤 때만 AI_CHAT_PROVIDER=google-genai.
      chat: ${AI_CHAT_PROVIDER:none}
    google:
      genai:
        # F-11 추천 설명과 같은 Google AI Studio 키를 공유한다.
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            model: ${AI_CHAT_MODEL:gemini-3.5-flash}
            # 조리 지시는 창작이 아니라 판단이다. 낮게 고정한다.
            temperature: 0.2

# health 는 기본 노출이지만 info 는 아니다. 배포 스모크가 "지금 뜬 컨테이너가 방금 민 커밋인가"를
# 확인해야 해서 info 를 연다(구 컨테이너도 health 는 UP 이라 health 만으로는 구분이 안 된다).
# 노출되는 값은 커밋 SHA 하나뿐이다 — 비밀이 아니며, 이미지 태그로도 이미 드러난다.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

info:
  app:
    commit: ${APP_GIT_SHA:unknown}   # Dockerfile 의 ARG GIT_SHA 로 주입. 로컬 실행이면 unknown.

# 다음 조리 추천 설명 생성. 키가 없거나 호출이 실패하면 규칙 결과는 유지하고 추천 fallback을 쓴다.
cookpilot:
  ai:
    gemini:
      enabled: ${GEMINI_ENABLED:false}
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.5-flash}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
      connect-timeout: ${GEMINI_CONNECT_TIMEOUT:2s}
      read-timeout: ${GEMINI_READ_TIMEOUT:4s}
    # Gemini Live 세션 토큰 발급(ephemeral token). 위와 같은 AI Studio 키를 공유한다.
    live:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_LIVE_MODEL:gemini-3.1-flash-live-preview}
  # 리뷰 사진 저장소. 버킷이 비어 있으면 업로드 없이 목 URL 을 돌려준다(로컬 개발 기본값).
  photos:
    bucket: ${PHOTOS_BUCKET:}
    region: ${PHOTOS_REGION:ap-northeast-2}

---
# db 프로파일: 실제 postgres. 운영/서버 배포는 SPRING_PROFILES_ACTIVE=db 로 이 설정을 쓴다.
#
# 스키마 정본은 Flyway(db/migration)이고, JPA는 validate 로 일치 여부만 검사한다.
# 접속 정보는 환경변수로 주입해 이미지 재빌드 없이 DB를 교체할 수 있다(기본값=로컬 compose).
#
# 로컬 실행:  ./gradlew bootRun --args='--spring.profiles.active=db'
spring:
  config:
    activate:
      on-profile: db
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cookpilot}
    username: ${DB_USERNAME:cookpilot}
    password: ${DB_PASSWORD:cookpilot}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true                 # 기동 시 V1, V2... 미적용 마이그레이션 실행
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate          # 엔티티 매핑 == 실제 스키마 검증만 (변경 금지)
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
